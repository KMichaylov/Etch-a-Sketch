<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
    <title>Etch-a-Sketch</title>
  </head>
  <body>
    <h1>Etch-a-Sketch</h1>
    <div class="container">
      <div id="grid-container"></div>
      <div id="controls-container">
        <input id="color" class="controls" type="color" />
        <button id="random" class="controls">Random</button>
        <input id="size" class="controls" type="range" min="2" max="100" />
        <button id="clear" class="controls">Clear</button>
      </div>
    </div>
  </body>
  <footer>
    Made by 
  </footer>
</html>
